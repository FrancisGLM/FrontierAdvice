services:
  strapiDB:
    container_name: strapiDB
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: frontieradvice_db
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi123
    ports:
      - "5432:5432"
    volumes:
      - strapi-data:/var/lib/postgresql/data
    networks:
      - frontier-network

  strapi:
    container_name: strapi
    build: ./strapi
    restart: unless-stopped
    env_file: ./strapi/.env
    environment:
      NODE_ENV: development
      DATABASE_CLIENT: postgres
      DATABASE_HOST: strapiDB
      DATABASE_PORT: 5432
      DATABASE_NAME: frontieradvice_db
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi123
    ports:
      - "1337:1337"
    volumes:
      - ./strapi/config:/opt/app/config
      - ./strapi/src:/opt/app/src
      - ./strapi/public/uploads:/opt/app/public/uploads
      - ./strapi/package.json:/opt/app/package.json
      - ./strapi/types:/opt/app/types
      - ./strapi/package-lock.json:/opt/app/package-lock.json
      - ./strapi/.env:/opt/app/.env
    depends_on:
      - strapiDB
    networks:
      - frontier-network

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-frontier
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - ./n8n/.env
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/local-files:/files
    networks:
      - frontier-network


  frontend:
    container_name: frontier-frontend
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_STRAPI_URL: https://strapi.frontieradvice.tech
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.ts:/app/next.config.ts
    ports:
      - "3000:3000"
    networks:
      - frontier-network
    depends_on:
      - strapi

  playwright-mcp:
    image: acuvity/mcp-server-playwright:0.0.56
    container_name: playwright-mcp
    user: "0:0"
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - frontier-network
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/ms-playwright
    volumes:
      - playwright_tmp:/tmp/ms-playwright
  
  waha-frontier:
    image: devlikeapro/waha
    container_name: waha-frontier
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - WHATSAPP_API_KEY=e18db994-592d-46bb-9b96-e2da839c0961
      - WHATSAPP_START_SESSION=default
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=89157549
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      - frontier-network

volumes:
  strapi-data:
  n8n_data:
  playwright_tmp:
  waha_sessions:
  

networks:
  frontier-network:
    driver: bridge
